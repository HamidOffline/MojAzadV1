name: MojAzad Build / Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'حالت اجرا'
        required: true
        type: choice
        default: test
        options:
          - test
          - publish

      confirm_stable_release:
        description: 'فقط برای انتشار Stable فعال شود'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          if ! grep -q 'ndkVersion = "29.0.14206865"' \
            "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"; then

            sed -i '/^android {/a\    ndkVersion = "29.0.14206865"' \
              "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"
          fi

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: |
          cp -r \
            "${{ github.workspace }}/libs" \
            "${{ github.workspace }}/V2rayNG/app/"

      - name: Detect AndroidLibXrayLite version
        run: |
          CURRENT_TAG="$(git -C \
            "${{ github.workspace }}/AndroidLibXrayLite" \
            describe --tags --abbrev=0)"

          if [ -z "$CURRENT_TAG" ]; then
            echo "ERROR: AndroidLibXrayLite tag could not be detected."
            exit 1
          fi

          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read MojAzad version
        run: |
          VERSION_NAME="$(grep -m1 'versionName = ' \
            "${{ github.workspace }}/V2rayNG/app/build.gradle.kts" \
            | sed -E 's/.*"([^"]+)".*/\1/')"

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: versionName could not be detected."
            exit 1
          fi

          case "$VERSION_NAME" in
            *-beta*|*-alpha*|*-rc*)
              IS_PRERELEASE="true"
              ;;
            *)
              IS_PRERELEASE="false"
              ;;
          esac

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

          echo "Mode: ${{ inputs.mode }}"
          echo "Version: $VERSION_NAME"
          echo "Pre-release: $IS_PRERELEASE"

      - name: Protect stable publish
        if: inputs.mode == 'publish' && env.IS_PRERELEASE == 'false'
        run: |
          if [ "${{ inputs.confirm_stable_release }}" != "true" ]; then
            echo "ERROR: Stable release requires explicit confirmation."
            echo "Run again and enable confirm_stable_release."
            exit 1
          fi

          echo "Stable release explicitly confirmed."

      # =========================================================
      # TEST MODE
      # =========================================================

      - name: Build ARM64 Debug APK
        if: inputs.mode == 'test'
        run: |
          cd "${{ github.workspace }}/V2rayNG"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          chmod 755 gradlew

          ./gradlew assemblePlaystoreDebug \
            -PABI_FILTERS=arm64-v8a

      - name: Collect ARM64 Debug APK
        if: inputs.mode == 'test'
        run: |
          OUTPUT_DIR="${{ github.workspace }}/mojazad-arm64-debug"

          mkdir -p "$OUTPUT_DIR"

          find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "MojAzad_${VERSION_NAME}_arm64-v8a.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          echo "Generated ARM64 Debug APK:"
          ls -lah "$OUTPUT_DIR"

          APK_COUNT="$(find "$OUTPUT_DIR" \
            -type f \
            -name '*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 ARM64 APK but found $APK_COUNT."
            exit 1
          fi

      - name: Upload ARM64 Debug Artifact
        if: inputs.mode == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: MojAzad-${{ env.VERSION_NAME }}-ARM64-Debug-Only
          path: ${{ github.workspace }}/mojazad-arm64-debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # PUBLISH MODE
      # =========================================================

      - name: Restore MojAzad release keystore
        if: inputs.mode == 'publish'
        env:
          MOJAZAD_KEYSTORE_BASE64: ${{ secrets.MOJAZAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${MOJAZAD_KEYSTORE_BASE64}" ]; then
            echo "ERROR: MOJAZAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "${{ github.workspace }}/keystore"

          printf '%s' "${MOJAZAD_KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${{ github.workspace }}/keystore/mojazad-release.jks"

          if [ ! -s "${{ github.workspace }}/keystore/mojazad-release.jks" ]; then
            echo "ERROR: Restored keystore is empty."
            exit 1
          fi

          echo "MOJAZAD_KEYSTORE_PATH=${{ github.workspace }}/keystore/mojazad-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build Full Release
        if: inputs.mode == 'publish'
        env:
          MOJAZAD_KEYSTORE_PASSWORD: ${{ secrets.MOJAZAD_KEYSTORE_PASSWORD }}
          MOJAZAD_KEY_ALIAS: ${{ secrets.MOJAZAD_KEY_ALIAS }}
          MOJAZAD_KEY_PASSWORD: ${{ secrets.MOJAZAD_KEY_PASSWORD }}
        run: |
          cd "${{ github.workspace }}/V2rayNG"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          chmod 755 gradlew

          ./gradlew assemblePlaystoreRelease

      - name: Collect Release APKs
        if: inputs.mode == 'publish'
        run: |
          RELEASE_DIR="${{ github.workspace }}/mojazad-release"

          mkdir -p "$RELEASE_DIR"

          find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "MojAzad_${VERSION_NAME}_*.apk" \
            -exec cp {} "$RELEASE_DIR/" \;

          echo "Generated Release APKs:"
          ls -lah "$RELEASE_DIR"

          APK_COUNT="$(find "$RELEASE_DIR" \
            -type f \
            -name '*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -ne 5 ]; then
            echo "ERROR: Expected exactly 5 APK files but found $APK_COUNT."
            exit 1
          fi

      - name: Generate SHA256 checksums
        if: inputs.mode == 'publish'
        run: |
          cd "${{ github.workspace }}/mojazad-release"

          sha256sum *.apk \
            | sort \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Verify release does not already exist
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release ${RELEASE_TAG} already exists."
            exit 1
          fi

      - name: Publish GitHub Pre-release
        if: inputs.mode == 'publish' && env.IS_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${{ github.workspace }}/mojazad-release/"*.apk \
            "${{ github.workspace }}/mojazad-release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "MojAzad ${VERSION_NAME}" \
            --generate-notes \
            --prerelease

      - name: Publish GitHub Stable Release
        if: inputs.mode == 'publish' && env.IS_PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${{ github.workspace }}/mojazad-release/"*.apk \
            "${{ github.workspace }}/mojazad-release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "MojAzad ${VERSION_NAME}" \
            --generate-notes

      - name: Upload Full Release Artifact
        if: inputs.mode == 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: MojAzad-${{ env.VERSION_NAME }}-Release
          path: |
            ${{ github.workspace }}/mojazad-release/*.apk
            ${{ github.workspace }}/mojazad-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
