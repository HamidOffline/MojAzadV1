name: MojAzad Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;29.0.14206865"

      - name: Build libhev1tun
        run: |
          bash compile-hev.sh

      - name: Copy libhev1tun
        run: |
          cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app/"

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.11
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Debug APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MojAzad APK
        uses: actions/upload-artifact@v4
        with:
          name: MojAzad-Debug-APK
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
