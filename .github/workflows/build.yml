name: MojAzad Build / Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'حالت اجرا'
        required: true
        type: choice
        default: test
        options:
          - test
          - prerelease
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          if ! grep -q 'ndkVersion = "29.0.14206865"' \
            "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"; then

            sed -i '/^android {/a\    ndkVersion = "29.0.14206865"' \
              "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"
          fi

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: |
          cp -r \
            "${{ github.workspace }}/libs" \
            "${{ github.workspace }}/V2rayNG/app/"

      - name: Detect AndroidLibXrayLite version
        run: |
          CURRENT_TAG="$(git -C \
            "${{ github.workspace }}/AndroidLibXrayLite" \
            describe --tags --abbrev=0)"

          if [ -z "$CURRENT_TAG" ]; then
            echo "ERROR: AndroidLibXrayLite tag could not be detected."
            exit 1
          fi

          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # =========================================================
      # AUTO VERSION
      # =========================================================

      - name: Calculate MojAzad version
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e

          BUILD_FILE="${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

          BASE_VERSION="$(grep -m1 'versionName = ' "$BUILD_FILE" \
            | sed -E 's/.*"([^"]+)".*/\1/' \
            | sed -E 's/-(beta|alpha|rc)[0-9]+$//')"

          if [ -z "$BASE_VERSION" ]; then
            echo "ERROR: Base version could not be detected."
            exit 1
          fi

          IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<EOF
          $BASE_VERSION
          EOF

          if [ -z "$BASE_MAJOR" ] || [ -z "$BASE_MINOR" ] || [ -z "$BASE_PATCH" ]; then
            echo "ERROR: Invalid base version: $BASE_VERSION"
            exit 1
          fi

          echo "Base project version: $BASE_VERSION"

          RELEASE_TAGS="$(gh release list \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$' \
            || true)"

          STABLE_TAGS="$(printf '%s\n' "$RELEASE_TAGS" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || true)"

          if [ -n "$STABLE_TAGS" ]; then
            LATEST_STABLE="$(printf '%s\n' "$STABLE_TAGS" \
              | sed 's/^v//' \
              | sort -V \
              | tail -n 1)"
          else
            LATEST_STABLE="$BASE_VERSION"
          fi

          IFS='.' read -r STABLE_MAJOR STABLE_MINOR STABLE_PATCH <<EOF
          $LATEST_STABLE
          EOF

          NEXT_PATCH=$((STABLE_PATCH + 1))
          NEXT_BASE="${STABLE_MAJOR}.${STABLE_MINOR}.${NEXT_PATCH}"

          if [ "$MODE" = "test" ]; then
            VERSION_NAME="${BASE_VERSION}-test"
            RELEASE_TAG=""
            IS_PRERELEASE="false"

          elif [ "$MODE" = "prerelease" ]; then

            BETA_NUMBERS="$(printf '%s\n' "$RELEASE_TAGS" \
              | grep -E "^v${NEXT_BASE}-beta[0-9]+$" \
              | sed -E 's/.*-beta([0-9]+)$/\1/' \
              || true)"

            if [ -n "$BETA_NUMBERS" ]; then
              LAST_BETA="$(printf '%s\n' "$BETA_NUMBERS" \
                | sort -n \
                | tail -n 1)"
              NEXT_BETA=$((LAST_BETA + 1))
            else
              NEXT_BETA=1
            fi

            VERSION_NAME="${NEXT_BASE}-beta${NEXT_BETA}"
            RELEASE_TAG="v${VERSION_NAME}"
            IS_PRERELEASE="true"

          elif [ "$MODE" = "release" ]; then

            VERSION_NAME="$NEXT_BASE"
            RELEASE_TAG="v${VERSION_NAME}"
            IS_PRERELEASE="false"

          else
            echo "ERROR: Unknown mode: $MODE"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

          echo "Mode: $MODE"
          echo "Version name: $VERSION_NAME"
          echo "Release tag: $RELEASE_TAG"

      - name: Calculate versionCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          BUILD_FILE="${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

          CURRENT_VERSION_CODE="$(grep -m1 'versionCode = ' "$BUILD_FILE" \
            | sed -E 's/[^0-9]*([0-9]+).*/\1/')"

          if [ -z "$CURRENT_VERSION_CODE" ]; then
            echo "ERROR: versionCode could not be detected."
            exit 1
          fi

          RELEASE_COUNT="$(gh release list \
            --limit 1000 \
            --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-beta[0-9]+)?$"))] | length')"

          AUTO_VERSION_CODE=$((CURRENT_VERSION_CODE + RELEASE_COUNT + 1))

          echo "VERSION_CODE=$AUTO_VERSION_CODE" >> "$GITHUB_ENV"

          echo "Current source versionCode: $CURRENT_VERSION_CODE"
          echo "Published MojAzad releases: $RELEASE_COUNT"
          echo "Build versionCode: $AUTO_VERSION_CODE"

      - name: Apply calculated version
        run: |
          set -e

          BUILD_FILE="${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

          sed -i -E \
            "0,/versionName = \".*\"/s//versionName = \"${VERSION_NAME}\"/" \
            "$BUILD_FILE"

          sed -i -E \
            "0,/versionCode = [0-9]+/s//versionCode = ${VERSION_CODE}/" \
            "$BUILD_FILE"

          echo "Applied version:"
          grep -m1 'versionName = ' "$BUILD_FILE"
          grep -m1 'versionCode = ' "$BUILD_FILE"

      # =========================================================
      # TEST MODE
      # =========================================================

      - name: Build ARM64 Debug APK
        if: inputs.mode == 'test'
        run: |
          cd "${{ github.workspace }}/V2rayNG"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          chmod 755 gradlew

          ./gradlew assemblePlaystoreDebug \
            -PABI_FILTERS=arm64-v8a

      - name: Collect ARM64 Debug APK
        if: inputs.mode == 'test'
        run: |
          OUTPUT_DIR="${{ github.workspace }}/mojazad-arm64-debug"

          mkdir -p "$OUTPUT_DIR"

          find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "MojAzad_${VERSION_NAME}_arm64-v8a.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          echo "Generated ARM64 Debug APK:"
          ls -lah "$OUTPUT_DIR"

          APK_COUNT="$(find "$OUTPUT_DIR" \
            -type f \
            -name '*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 ARM64 APK but found $APK_COUNT."
            exit 1
          fi

      - name: Upload ARM64 Debug Artifact
        if: inputs.mode == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: MojAzad-${{ env.VERSION_NAME }}-ARM64-Debug
          path: ${{ github.workspace }}/mojazad-arm64-debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # RELEASE / PRERELEASE
      # =========================================================

      - name: Restore MojAzad release keystore
        if: inputs.mode != 'test'
        env:
          MOJAZAD_KEYSTORE_BASE64: ${{ secrets.MOJAZAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${MOJAZAD_KEYSTORE_BASE64}" ]; then
            echo "ERROR: MOJAZAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "${{ github.workspace }}/keystore"

          printf '%s' "${MOJAZAD_KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${{ github.workspace }}/keystore/mojazad-release.jks"

          if [ ! -s "${{ github.workspace }}/keystore/mojazad-release.jks" ]; then
            echo "ERROR: Restored keystore is empty."
            exit 1
          fi

          echo "MOJAZAD_KEYSTORE_PATH=${{ github.workspace }}/keystore/mojazad-release.jks" \
            >> "$GITHUB_ENV"

      - name: Verify release tag does not already exist
        if: inputs.mode != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release ${RELEASE_TAG} already exists."
            exit 1
          fi

      - name: Build signed Full Release
        if: inputs.mode != 'test'
        env:
          MOJAZAD_KEYSTORE_PASSWORD: ${{ secrets.MOJAZAD_KEYSTORE_PASSWORD }}
          MOJAZAD_KEY_ALIAS: ${{ secrets.MOJAZAD_KEY_ALIAS }}
          MOJAZAD_KEY_PASSWORD: ${{ secrets.MOJAZAD_KEY_PASSWORD }}
        run: |
          cd "${{ github.workspace }}/V2rayNG"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          chmod 755 gradlew

          ./gradlew assemblePlaystoreRelease

      - name: Collect Release APKs
        if: inputs.mode != 'test'
        run: |
          RELEASE_DIR="${{ github.workspace }}/mojazad-release"

          mkdir -p "$RELEASE_DIR"

          find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "MojAzad_${VERSION_NAME}_*.apk" \
            -exec cp {} "$RELEASE_DIR/" \;

          echo "Generated Release APKs:"
          ls -lah "$RELEASE_DIR"

          APK_COUNT="$(find "$RELEASE_DIR" \
            -type f \
            -name '*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -ne 5 ]; then
            echo "ERROR: Expected exactly 5 APK files but found $APK_COUNT."
            exit 1
          fi

      - name: Generate SHA256 checksums
        if: inputs.mode != 'test'
        run: |
          cd "${{ github.workspace }}/mojazad-release"

          sha256sum *.apk \
            | sort \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Publish GitHub Pre-release
        if: inputs.mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${{ github.workspace }}/mojazad-release/"*.apk \
            "${{ github.workspace }}/mojazad-release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "MojAzad ${VERSION_NAME}" \
            --generate-notes \
            --prerelease

      - name: Publish GitHub Stable Release
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${{ github.workspace }}/mojazad-release/"*.apk \
            "${{ github.workspace }}/mojazad-release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "MojAzad ${VERSION_NAME}" \
            --generate-notes

      - name: Upload Full Release Artifact
        if: inputs.mode != 'test'
        uses: actions/upload-artifact@v7
        with:
          name: MojAzad-${{ env.VERSION_NAME }}-Release
          path: |
            ${{ github.workspace }}/mojazad-release/*.apk
            ${{ github.workspace }}/mojazad-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
