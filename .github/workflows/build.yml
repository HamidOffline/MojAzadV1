name: MojAzad Full Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

      - name: Restore cached libhev1tun
        id: cache-libhev1tun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhev1tun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhev1tun
        if: steps.cache-libhev1tun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh

      - name: Save libhev1tun
        if: steps.cache-libhev1tun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhev1tun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhev1tun
        run: |
          cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app/"

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Current tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read MojAzad version
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' \
            "${{ github.workspace }}/V2rayNG/app/build.gradle.kts" \
            | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: versionName could not be detected."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"

          echo "MojAzad version: $VERSION_NAME"
          echo "GitHub release tag: v$VERSION_NAME"

      - name: Restore MojAzad release keystore
        env:
          MOJAZAD_KEYSTORE_BASE64: ${{ secrets.MOJAZAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${MOJAZAD_KEYSTORE_BASE64}" ]; then
            echo "ERROR: MOJAZAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "${{ github.workspace }}/keystore"

          echo "${MOJAZAD_KEYSTORE_BASE64}" | base64 --decode \
            > "${{ github.workspace }}/keystore/mojazad-release.jks"

          echo "MOJAZAD_KEYSTORE_PATH=${{ github.workspace }}/keystore/mojazad-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build MojAzad Full Release
        env:
          MOJAZAD_KEYSTORE_PASSWORD: ${{ secrets.MOJAZAD_KEYSTORE_PASSWORD }}
          MOJAZAD_KEY_ALIAS: ${{ secrets.MOJAZAD_KEY_ALIAS }}
          MOJAZAD_KEY_PASSWORD: ${{ secrets.MOJAZAD_KEY_PASSWORD }}
        run: |
          cd "${{ github.workspace }}/V2rayNG"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          chmod 755 gradlew

          ./gradlew assemblePlaystoreRelease

      - name: Collect MojAzad Release APKs
        run: |
          mkdir -p "${{ github.workspace }}/mojazad-release"

          find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "MojAzad_${VERSION_NAME}_*.apk" \
            -exec cp {} "${{ github.workspace }}/mojazad-release/" \;

          echo "Generated APK files:"
          ls -lah "${{ github.workspace }}/mojazad-release"

          APK_COUNT=$(find "${{ github.workspace }}/mojazad-release" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -ne 5 ]; then
            echo "ERROR: Expected 5 APK files but found $APK_COUNT."
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          cd "${{ github.workspace }}/mojazad-release"

          sha256sum *.apk > SHA256SUMS.txt

          echo "SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Upload MojAzad Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MojAzad-${{ env.VERSION_NAME }}-Release
          path: |
            ${{ github.workspace }}/mojazad-release/*.apk
            ${{ github.workspace }}/mojazad-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release ${RELEASE_TAG} already exists."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${{ github.workspace }}/mojazad-release/"*.apk \
            "${{ github.workspace }}/mojazad-release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "MojAzad ${VERSION_NAME}" \
            --generate-notes
